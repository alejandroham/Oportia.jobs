<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" width="100%" height="100%">
  <defs>
    <linearGradient id="logoIconGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#173B50"/>
      <stop offset="100%" stop-color="#20A88A"/>
    </linearGradient>
  </defs>

  <!-- Left Icon Symbol (Squircle) -->
  <g transform="translate(4, 5)">
    <rect x="0" y="0" width="60" height="60" rx="16" fill="url(#logoIconGrad)"/>
    <path d="M 18 44 C 18 30, 26 20, 42 18" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 35 14 L 43 18 L 40 26" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="18" cy="44" r="4.5" fill="#FFFFFF"/>
    <circle cx="18" cy="44" r="2.5" fill="#20A88A"/>
    <circle cx="43" cy="18" r="4.5" fill="#FF906F"/>
    <circle cx="43" cy="18" r="2" fill="#FFFFFF"/>
  </g>

  <!-- Typography: Oportia -->
  <text x="76" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Manrope', 'Inter', 'SF Pro Display', sans-serif" font-size="32" font-weight="800" fill="#173B50" letter-spacing="-0.5">
    Oportia
  </text>

  <!-- Descriptor: Jobs IA Badge -->
  <g transform="translate(204, 23)">
    <rect x="0" y="0" width="76" height="24" rx="12" fill="#EDF3F5" stroke="#20A88A" stroke-width="1.2"/>
    <text x="12" y="16.5" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="700" fill="#20A88A" letter-spacing="0.4">
      Jobs IA
    </text>
  </g>
</svg>
