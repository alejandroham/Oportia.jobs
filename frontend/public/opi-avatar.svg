<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <!-- Background Soft Glow -->
    <radialGradient id="opiGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#8AD9C4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#20A88A" stop-opacity="0"/>
    </radialGradient>
    <!-- Body Capsule Gradient -->
    <linearGradient id="opiBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#EDF3F5"/>
      <stop offset="100%" stop-color="#DCE5EA"/>
    </linearGradient>
    <!-- Head Visor Gradient -->
    <linearGradient id="opiVisorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3B50"/>
      <stop offset="100%" stop-color="#173B50"/>
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="80" cy="80" r="74" fill="url(#opiGlow)"/>

  <!-- Squircle Base Accent Frame -->
  <rect x="8" y="8" width="144" height="144" rx="36" fill="#EDF3F5" stroke="#20A88A" stroke-width="2.5" stroke-opacity="0.3"/>

  <!-- Head / Body - Friendly Rounded Pod -->
  <rect x="36" y="32" width="88" height="92" rx="42" fill="url(#opiBodyGrad)" stroke="#173B50" stroke-width="3.5"/>

  <!-- Friendly Antenna / Spark of Insight -->
  <path d="M 80 32 L 80 18" stroke="#20A88A" stroke-width="4" stroke-linecap="round"/>
  <circle cx="80" cy="15" r="6" fill="#FF906F"/>
  <circle cx="80" cy="15" r="2.5" fill="#FFFFFF"/>

  <!-- Soft Ear Pods -->
  <rect x="28" y="60" width="10" height="26" rx="5" fill="#20A88A"/>
  <rect x="122" y="60" width="10" height="26" rx="5" fill="#20A88A"/>

  <!-- Visor Face Plate -->
  <rect x="46" y="48" width="68" height="48" rx="22" fill="url(#opiVisorGrad)"/>

  <!-- Expressive Cute Eyes (Jade Glow with white catchlights) -->
  <g>
    <!-- Left Eye -->
    <ellipse cx="64" cy="70" rx="6.5" ry="8.5" fill="#20A88A"/>
    <circle cx="62" cy="67" r="2.5" fill="#FFFFFF"/>
    <circle cx="66" cy="73" r="1.2" fill="#8AD9C4"/>

    <!-- Right Eye -->
    <ellipse cx="96" cy="70" rx="6.5" ry="8.5" fill="#20A88A"/>
    <circle cx="94" cy="67" r="2.5" fill="#FFFFFF"/>
    <circle cx="98" cy="73" r="1.2" fill="#8AD9C4"/>
  </g>

  <!-- Subtle Cute Cheeks (Coral Blush #FF906F) -->
  <ellipse cx="53" cy="79" rx="4.5" ry="2.5" fill="#FF906F" opacity="0.75"/>
  <ellipse cx="107" cy="79" rx="4.5" ry="2.5" fill="#FF906F" opacity="0.75"/>

  <!-- Sweet Smile -->
  <path d="M 74 77 Q 80 83 86 77" fill="none" stroke="#20A88A" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Heart/Core Badge on Chest (Warm Empathetic Pulse) -->
  <circle cx="80" cy="107" r="7" fill="#20A88A"/>
  <circle cx="80" cy="107" r="4" fill="#FF906F"/>
</svg>
