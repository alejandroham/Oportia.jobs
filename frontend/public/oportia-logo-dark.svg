<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" width="100%" height="100%">
  <defs>
    <linearGradient id="logoDarkGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2E536C"/>
      <stop offset="100%" stop-color="#20A88A"/>
    </linearGradient>
  </defs>

  <!-- Left Icon Symbol (Squircle) -->
  <g transform="translate(4, 5)">
    <rect x="0" y="0" width="60" height="60" rx="16" fill="url(#logoDarkGrad)" stroke="#46667D" stroke-width="1.5"/>
    <path d="M 18 44 C 18 30, 26 20, 42 18" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 35 14 L 43 18 L 40 26" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="18" cy="44" r="4.5" fill="#FFFFFF"/>
    <circle cx="18" cy="44" r="2.5" fill="#20A88A"/>
    <circle cx="43" cy="18" r="4.5" fill="#FF906F"/>
    <circle cx="43" cy="18" r="2" fill="#FFFFFF"/>
  </g>

  <!-- Typography: Oportia (Crisp White / Niebla in Night Mode) -->
  <text x="76" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Manrope', 'Inter', 'SF Pro Display', sans-serif" font-size="32" font-weight="800" fill="#F4F7F9" letter-spacing="-0.5">
    Oportia
  </text>

  <!-- Descriptor: Jobs IA Badge (más grande y con contraste AA; antes ~6 px en pantalla) -->
  <g transform="translate(206, 20)">
    <rect x="0" y="0" width="92" height="30" rx="15" fill="#264860" stroke="#4EBDA4" stroke-width="1.5"/>
    <text x="46" y="20.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="15" font-weight="800" fill="#C2EBE1" letter-spacing="0.3">Jobs IA</text>
  </g>
</svg>
