# Actualizaciones de dependencias (ver SECURITY.md, sección 4).
# Las alertas de seguridad se activan aparte en Settings → Code security → Dependabot alerts.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      dependencias-frontend:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Las versiones mayores cambian cosas de fondo: se actualizan a mano, con revisión.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      dependencias-backend:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Las versiones mayores cambian cosas de fondo: se actualizan a mano, con revisión.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /          # requirements.txt de la raíz (lo usa Vercel)
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      # Las versiones mayores cambian cosas de fondo: se actualizan a mano, con revisión.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # En GitHub Actions las versiones mayores (p. ej. checkout@v5 -> v6) son la forma normal de actualizar
  # y rara vez rompen algo: se mantienen.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
