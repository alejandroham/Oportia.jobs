name: CI — Integración Continua

on:
  push:
    branches:
      - main
      - master
      - 'fase-*'
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (Lint, Typecheck, Test, Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: ./frontend
        run: npm ci

      - name: Verificación de sintaxis y linting
        working-directory: ./frontend
        run: npm run lint

      - name: Verificación estricta de tipos (TypeScript)
        working-directory: ./frontend
        run: npm run typecheck

      - name: Pruebas unitarias y de integración (Vitest)
        working-directory: ./frontend
        run: npm test

      - name: Compilación para producción (Vite Build)
        working-directory: ./frontend
        run: npm run build

  backend:
    name: Backend (Pytest Suite Offline)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar pruebas con Pytest (100% offline)
        run: pytest backend/tests -v
