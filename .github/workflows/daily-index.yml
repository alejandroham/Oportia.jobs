name: Índice diario de ofertas

# Todas las mañanas a las 08:00 de Chile arma el índice de ofertas, lo publica en Supabase Storage
# y, si están los secretos, envía el correo con las ofertas nuevas del día.
# GitHub usa UTC: 11:00 UTC en horario de verano (UTC-3) y 12:00 UTC en invierno (UTC-4).
# Se programan ambas y solo corre la que corresponde a la estación. Puede retrasarse unos minutos.
on:
  schedule:
    - cron: '0 11 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch: {}

concurrency:
  group: daily-index
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-index:
    name: Armar y publicar el índice
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: ¿Son las 08:00 en Chile?
        id: gate
        run: |
          offset=$(TZ=America/Santiago date +%z)
          schedule='${{ github.event.schedule }}'
          run=true
          if [ "$schedule" = '0 11 * * *' ] && [ "$offset" != "-0300" ]; then run=false; fi
          if [ "$schedule" = '0 12 * * *' ] && [ "$offset" != "-0400" ]; then run=false; fi
          echo "Chile UTC$offset · programación '$schedule' · corre: $run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Checkout del código
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v7

      - name: Configurar Python 3.11
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        if: steps.gate.outputs.run == 'true'
        run: pip install -r backend/requirements.txt

      - name: Armar y publicar el índice
        if: steps.gate.outputs.run == 'true'
        working-directory: ./backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Correo diario (Etapa C). Sin estos secretos no se envía nada. El correo nunca se imprime.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          NOTIFY_FROM: ${{ secrets.NOTIFY_FROM }}
          NOTIFY_KEYWORDS: ${{ secrets.NOTIFY_KEYWORDS }}
        run: python -m app.indexer.build

      - name: Borrar opiniones (12 meses) y eventos de uso (90 días) antiguos
        if: steps.gate.outputs.run == 'true'
        working-directory: ./backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m app.feedback

